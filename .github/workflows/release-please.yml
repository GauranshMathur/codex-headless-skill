name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Accumulates conventional commits into a release PR. Merging that PR tags
      # the release, writes CHANGELOG.md, and bumps the version in both plugin
      # manifests via the extra-files config.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
